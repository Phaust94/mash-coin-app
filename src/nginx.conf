server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Inherited by locations that do not define their own add_header.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # App shell: revalidate on every load so a new deployment is picked up.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # The service worker must never be cached, or PWA updates get stuck.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints filenames in /assets, so cache them for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public images and fonts are not fingerprinted.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
